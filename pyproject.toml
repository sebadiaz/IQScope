[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqscope"
version = "0.15.0"
description = "Automatic offline IQ signal discovery and evidence-based decoder trials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "reedsolo==1.7.0", "scipy>=1.10", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
iqscope = "iqscope:main"

[tool.setuptools]
py-modules = ["iqscope", "iqscope_decoders", "iqscope_channels", "iqscope_rtl433", "iqscope_formats", "iqscope_datasets", "iqscope_rtty", "iqscope_cw", "iqscope_fsk", "iqscope_fsk4", "iqscope_psk", "iqscope_psk_rrc", "iqscope_ao40", "iqscope_psk_audio", "iqscope_ax25", "iqscope_audio", "iqscope_recordings", "iqscope_afsk", "iqscope_ofdm", "iqscope_lora", "iqscope_lora_header", "iqscope_lora_payload", "iqscope_lora_search", "iqscope_lora_experimental", "iqscope_lora_soft", "iqscope_lora_sync_scores"]
packages = ["iqscope_web"]

[tool.setuptools.package-data]
iqscope_web = ["static/*", "data/*.json"]
