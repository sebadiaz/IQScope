[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqscope"
version = "0.7.1"
description = "Automatic offline IQ signal discovery and evidence-based decoder trials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
iqscope = "iqscope:main"

[tool.setuptools]
py-modules = ["iqscope", "iqscope_decoders", "iqscope_formats", "iqscope_datasets", "iqscope_rtty", "iqscope_cw", "iqscope_fsk"]
packages = ["iqscope_web"]

[tool.setuptools.package-data]
iqscope_web = ["static/*", "data/*.json"]
