[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqscope"
version = "0.1.0"
description = "Automatic offline IQ signal discovery and evidence-based decoder trials"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
iqscope = "iqscope:main"

[tool.setuptools]
py-modules = ["iqscope"]
