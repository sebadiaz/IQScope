name: LoRaIQ unused-session benchmark
on:
  push:
    paths:
      - scripts/loraiq_extension.py
      - scripts/lora_soft_probe.py
      - scripts/lora_sync_gate.py
      - scripts/loraiq_forensic_probe.py
      - scripts/loraiq_batch.py
      - scripts/loraiq_reference.py
      - corpus/loraiq-extension-manifest.json
      - iqscope_lora*.py
      - .github/workflows/loraiq-extension.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python scripts/loraiq_extension.py
      - name: Research-only weak-frame analysis (confidence gates bypassed)
        run: python scripts/loraiq_forensic_probe.py --input corpus-cache/loraiq-extension/0/source.sigmf-meta
      - name: Audit research sync scores against white and colored spectra
        run: |
          python scripts/lora_sync_gate.py
          python scripts/lora_sync_gate.py --seed 20261101 --out corpus-cache/loraiq-forensic/sync-audit-second-seed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loraiq-unused-sessions
          path: |
            corpus-cache/loraiq-extension/observation.json
            corpus-cache/loraiq-forensic/observation.json
            corpus-cache/loraiq-forensic/sync-audit.json
            corpus-cache/loraiq-forensic/sync-audit-second-seed.json
