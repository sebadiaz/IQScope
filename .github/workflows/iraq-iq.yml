name: Iraq bounded IQ inspection
on:
  push:
    paths:
      - scripts/iraq_iq_probe.py
      - iqscope_ofdm.py
      - iqscope_lora.py
      - tests/test_ofdm.py
      - .github/workflows/iraq-iq.yml
permissions:
  contents: read
jobs:
  prefix:
    strategy:
      fail-fast: false
      matrix:
        recording: [ism915, uhf450, vhf144, vhf150]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python scripts/iraq_iq_probe.py --analyze-hypothesis le --seconds 1 --recording ${{ matrix.recording }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iraq-iq-${{ matrix.recording }}
          path: |
            corpus-cache/iraq-iq/observation.json
            corpus-cache/iraq-iq/*.analysis/report.json
            corpus-cache/iraq-iq/*.analysis/spectrum.csv
