name: Independent LoRaIQ reference
on:
  push:
    paths:
      - scripts/loraiq_reference.py
      - .github/workflows/loraiq-reference.yml
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python scripts/loraiq_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-loraiq-reference
          path: corpus-cache/loraiq/observation.json
