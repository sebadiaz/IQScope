name: Mendeley metadata probe
on:
  push:
    paths:
      - scripts/mendeley_metadata_probe.py
      - .github/workflows/mendeley-metadata.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/mendeley_metadata_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: mendeley-metadata-observation
          path: corpus-cache/mendeley/metadata.json
