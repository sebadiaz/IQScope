name: Iraq Zenodo source metadata
on:
  push:
    paths:
      - scripts/iraq_zenodo_probe.py
      - .github/workflows/iraq-zenodo.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/iraq_zenodo_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: iraq-zenodo-metadata
          path: corpus-cache/iraq-zenodo/metadata.json
