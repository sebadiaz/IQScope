name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: iqscope demo --out demo-ci
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' playwright
      - run: playwright install chromium
      - name: Install pinned CI audio dependency
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python scripts/setup_ci_ffmpeg.py
      - run: python tests/browser_smoke.py
        env:
          NO_PROXY: 127.0.0.1,localhost
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: browser-artifacts/
          if-no-files-found: ignore
  real-iq:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Check recorded IQ excerpts and independent synthetic windows
        run: |
          python scripts/sdrangel_corpus.py --name adsb --name rtty --name radar
          python scripts/panoradio_smoke.py
          python scripts/fpv_metadata_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-iq-reports
          path: |
            corpus-cache/**/provenance.json
            corpus-cache/**/results/report.json
          if-no-files-found: ignore
  audio-references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Install pinned CI audio dependency
        run: |
          python -m pip install imageio-ffmpeg==0.6.0
          python scripts/setup_ci_ffmpeg.py
      - run: ffmpeg -version
      - name: Inspect bounded UDXF receiver audio prefixes
        run: |
          python scripts/udxf_audio_probe.py
          python scripts/rtty_audio_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udxf-audio-reports
          path: |
            corpus-cache/udxf-audio/**/provenance.json
            corpus-cache/rtty-audio/provenance.json
            corpus-cache/rtty-audio/audio-results/report.json
          if-no-files-found: ignore
  vksdr-iq:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Check bounded VKSDR IQ WAV excerpts
        run: python scripts/vksdr_corpus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vksdr-iq-reports
          path: |
            corpus-cache/vksdr/**/provenance.json
            corpus-cache/vksdr/**/results/report.json
          if-no-files-found: ignore
