name: QAM laboratory reference
on:
  push:
    paths:
      - scripts/qam_lab_reference.py
      - scripts/qam_prbs15.py
      - scripts/qam_receiver_study.py
      - scripts/qam_phase_study.py
      - scripts/qam_sequence_study.py
      - scripts/qam_fse_study.py
      - scripts/qam_calibration_study.py
      - scripts/qam_blind_sync_study.py
      - scripts/qam_blind_objective_study.py
      - tests/test_qam_receiver_study.py
      - tests/test_qam_phase_study.py
      - tests/test_qam_sequence_study.py
      - tests/test_qam_fse_study.py
      - tests/test_qam_calibration_study.py
      - tests/test_qam_blind_sync_study.py
      - tests/test_qam_blind_objective_study.py
      - tests/test_qam_prbs15.py
      - .github/workflows/qam-lab.yml
      - iqscope_qam.py
      - iqscope_qam_soft.py
      - tests/test_qam_soft.py
      - tests/test_qam.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Inspect bounded archive and trial QAM without executing archive contents
        run: python scripts/qam_lab_reference.py
      - name: Compare bounded receiver and bit-likelihood measurements without PRBS feedback
        run: python scripts/qam_receiver_study.py
      - name: Compare blind phase tracking and correlated Gaussian noise on frozen verification bits
        run: python scripts/qam_phase_study.py
      - name: Compare prefix-trained sequence detection and impulsive-noise likelihoods
        run: python scripts/qam_sequence_study.py
      - name: Measure raw fractionally spaced filters using declared prefix targets and controls
        run: python scripts/qam_fse_study.py
      - name: Transfer calibration from strong QAM recordings without weak-reference feedback
        run: python scripts/qam_calibration_study.py
      - name: Compare independent fine timing and blind CMA MCMA RDE without reference targets
        run: python scripts/qam_blind_sync_study.py
      - name: Diagnose blind objectives and Gaussian moment correction without reference feedback
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/qam_blind_objective_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qam-laboratory-inspection
          path: |
            corpus-cache/qam-lab/inspection.json
            corpus-cache/qam-lab/receiver-study.json
            corpus-cache/qam-lab/phase-study.json
            corpus-cache/qam-lab/sequence-study.json
            corpus-cache/qam-lab/fse-study.json
            corpus-cache/qam-lab/calibration-study.json
            corpus-cache/qam-lab/blind-sync-study.json
            corpus-cache/qam-lab/blind-objective-study.json
          if-no-files-found: ignore
