name: QAM laboratory reference
on:
  push:
    paths:
      - scripts/qam_lab_reference.py
      - scripts/qam_prbs15.py
      - scripts/qam_receiver_study.py
      - tests/test_qam_receiver_study.py
      - tests/test_qam_prbs15.py
      - .github/workflows/qam-lab.yml
      - iqscope_qam.py
      - iqscope_qam_soft.py
      - tests/test_qam_soft.py
      - tests/test_qam.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Inspect bounded archive and trial QAM without executing archive contents
        run: python scripts/qam_lab_reference.py
      - name: Compare bounded receiver and bit-likelihood measurements without PRBS feedback
        run: python scripts/qam_receiver_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qam-laboratory-inspection
          path: |
            corpus-cache/qam-lab/inspection.json
            corpus-cache/qam-lab/receiver-study.json
          if-no-files-found: ignore
